name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # PASO CRÍTICO: Sin esto, obtendrás el error "No space left on device"
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build release APK
        env:
          GIT_TAG: ${{ github.ref_name }}
          CFLAGS: "-Wno-error=missing-braces"
          CXXFLAGS: "-Wno-error=missing-braces"
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          rm -f local.properties
          
          # He añadido los parámetros de memoria a tu lógica para evitar el OutOfMemoryError
          ./gradlew assembleRelease \
          -Porg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
          --no-daemon \
          -PstoreFile=release.jks \
          -PstorePassword=$SIGNING_KEY_PASSWORD \
          -PkeyAlias=$SIGNING_KEY_ALIAS \
          -PkeyPassword=$SIGNING_KEY_PASSWORD
          
          cd $GITHUB_WORKSPACE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/outputs/apk/release/*.apk"
          
