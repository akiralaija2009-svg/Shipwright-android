name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Configuración de caché para acelerar compilaciones futuras
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          # Decodificar keystore solo si existe el secreto
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then
            echo "$SIGNING_KEYSTORE_B64" | base64 -d > release.jks
          fi
          
          chmod +x gradlew
          # Limitamos la memoria de la JVM para evitar el error de "Out of Memory" (OOM)
          ./gradlew assembleRelease \
            -Porg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" \
            -PstoreFile=release.jks \
            -PstorePassword=$SIGNING_KEY_PASSWORD \
            -PkeyAlias=$SIGNING_KEY_ALIAS \
            -PkeyPassword=$SIGNING_KEY_PASSWORD
            
