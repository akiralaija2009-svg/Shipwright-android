name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Failsafe Swap Space
        run: |
          # Creando 8GB de RAM virtual. 'dd' es el método más lento pero el más seguro del mundo en Linux.
          sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true

      - name: Fetch annotated tag
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git fetch origin "+refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" || true

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat .github/workflows/apt-deps.txt)

      - name: Generate soh.o2r
        run: |
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target GenerateSohOtr -j 2
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r || echo "Assets copiados"

      - name: Decode keystore
        run: |
          # El certificado va directo a una zona temporal segura y absoluta del sistema
          echo '${{ secrets.SIGNING_KEYSTORE_B64 }}' | base64 -d > /tmp/release.jks

      - name: Neutralize Strict Warnings
        run: |
          # Destruimos cualquier configuración que intente detener la compilación por simples advertencias
          find . -type f -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
          find . -type f -name "*.cmake" -exec sed -i 's/-Werror//g' {} +

      - name: Build release APK
        env:
          # Frenamos el consumo de CPU para estabilizar la memoria RAM
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          rm -f local.properties
          
          # Modo Máximo: Inyectamos la orden estricta de usar 32-bits (armeabi-v7a) directo desde consola
          ./gradlew assembleRelease \
          -Pandroid.injected.build.abi="armeabi-v7a" \
          -PstoreFile=/tmp/release.jks \
          -PstorePassword=${{ secrets.SIGNING_KEY_PASSWORD }} \
          -PkeyAlias=${{ secrets.SIGNING_KEY_ALIAS }} \
          -PkeyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}
          
          cd $GITHUB_WORKSPACE
        
      - name: Rename APK
        run: |
          APK=$(find Android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -n "$APK" ]; then
            mv "$APK" "soh-${{ github.ref_name }}.apk"
          else
            echo "¡Error crítico! No se generó el APK."
            exit 1
          fi

      - name: Compute SHA256
        id: sha256
        run: |
          HASH=$(sha256sum "soh-${{ github.ref_name }}.apk" | awk '{print $1}')
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: soh-${{ github.ref_name }}.apk
        continue-on-error: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then TAG="latest"; fi
          
          OBJ_TYPE=$(git tag -l --format='%(objecttype)' "${TAG}") || OBJ_TYPE=""
          if [ "${OBJ_TYPE}" != "tag" ]; then
            ANNOTATION_BODY=$(printf '## Cambios\n- Compilación Exitosa')
          else
            ANNOTATION_BODY=$(git tag -l --format='%(contents:body)' "${TAG}")
          fi

          if [ -z "${ANNOTATION_BODY}" ]; then
            ANNOTATION_BODY=$(printf '## Cambios\n- Compilación Exitosa')
          fi

          printf '%s\n\n' "${ANNOTATION_BODY}" > /tmp/release-notes.md
          printf 'SHA256: %s\n' "${{ steps.sha256.outputs.hash }}" >> /tmp/release-notes.md
          printf 'Build: %s/%s/actions/runs/%s\n' "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" >> /tmp/release-notes.md

          gh release create "${TAG}" \
            "soh-${TAG}.apk" \
            --title "${TAG}" \
            --notes-file /tmp/release-notes.md || true
            
