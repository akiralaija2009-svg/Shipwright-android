name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          # 1. Preparar keystore
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > release.jks
          
          # 2. Configuración de permisos
          chmod +x gradlew
          
          # 3. Compilación limpia y secuencial (sin paralelismo para ahorrar RAM)
          # -Porg.gradle.parallel=false : Evita picos de memoria.
          # --no-daemon : Obliga a iniciar un proceso nuevo, más estable.
          # -Xmx2g : Límite estricto de 2GB de RAM para Java.
          ./gradlew clean assembleRelease \
            -Porg.gradle.parallel=false \
            -Porg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" \
            --no-daemon \
            -PstoreFile=release.jks \
            -PstorePassword=$SIGNING_KEY_PASSWORD \
            -PkeyAlias=$SIGNING_KEY_ALIAS \
            -PkeyPassword=$SIGNING_KEY_PASSWORD

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: Android/app/build/outputs/apk/release/*.apk
          
